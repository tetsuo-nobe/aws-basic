AWSTemplateFormatVersion: "2010-09-09"
Description: IAM Handson Environment Setup Template

# ==================================================
# Parameters
# ==================================================
Parameters:
  UserPassword:
    Type: String
    Description: Console sign-in password for IAM users
    NoEcho: true
    MinLength: 8

# ==================================================
# Resources
# ==================================================
Resources:

  # ------------------------------------------------
  # IAM Policies
  # ------------------------------------------------
  AllMostReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: allmost-readonly-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllMostReadOnlyAccess
            Effect: Allow
            Action:
              - apigateway:GET
              - autoscaling:Describe*
              - cloudformation:List*
              - cloudfront:Get*
              - cloudfront:List*
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
              - dynamodb:BatchGet*
              - dynamodb:Describe*
              - dynamodb:Get*
              - dynamodb:List*
              - dynamodb:Query
              - dynamodb:Scan
              - ec2:Describe*
              - ec2:Get*
              - elasticloadbalancing:Describe*
              - events:Describe*
              - events:List*
              - iam:Get*
              - iam:List*
              - kinesis:Describe*
              - kinesis:Get*
              - kinesis:List*
              - kms:Describe*
              - kms:Get*
              - kms:List*
              - lambda:Get*
              - lambda:List*
              - logs:Describe*
              - logs:Get*
              - logs:FilterLogEvents
              - logs:StartQuery
              - logs:StopQuery
              - logs:TestMetricFilter
              - rds:Describe*
              - rds:List*
              - s3:Get*
              - s3:List*
              - sqs:List*
              - ssm:Describe*
              - ssm:Get*
              - ssm:List*
              - sts:GetCallerIdentity
              - tag:Get*
            Resource: "*"

  LambdaHandsonPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: lambda-handson-policy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowLambdaCreateAndDelete
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
            Resource: "*"
          - Sid: AllowIamRoleForLambda
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:AttachRolePolicy
              - iam:PassRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/*"

  # ------------------------------------------------
  # Lambda Execution Role (used when creating Lambda functions in the handson)
  # ------------------------------------------------
  LambdaBasicExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: lambda-handson-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ------------------------------------------------
  # IAM Groups
  # ------------------------------------------------
  DemoGroup1:
    Type: AWS::IAM::Group
    Properties:
      GroupName: demo-group1
      ManagedPolicyArns:
        - !Ref AllMostReadOnlyPolicy

  DemoGroup2:
    Type: AWS::IAM::Group
    Properties:
      GroupName: demo-group2
      ManagedPolicyArns:
        - !Ref AllMostReadOnlyPolicy
        - !Ref LambdaHandsonPolicy

  # ------------------------------------------------
  # IAM Users
  # ------------------------------------------------
  DemoUser1:
    Type: AWS::IAM::User
    Properties:
      UserName: demo-user1
      LoginProfile:
        Password: !Ref UserPassword
        PasswordResetRequired: false
      Groups:
        - !Ref DemoGroup1

  DemoUser2:
    Type: AWS::IAM::User
    Properties:
      UserName: demo-user2
      LoginProfile:
        Password: !Ref UserPassword
        PasswordResetRequired: false
      Groups:
        - !Ref DemoGroup2

# ==================================================
# Outputs
# ==================================================
Outputs:
  ConsoleSignInUrl:
    Description: Management Console sign-in URL
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"

  DemoUser1Name:
    Description: Demo user 1 name
    Value: !Ref DemoUser1

  DemoUser2Name:
    Description: Demo user 2 name
    Value: !Ref DemoUser2

  AllMostReadOnlyPolicyArn:
    Description: AllMostReadOnly policy ARN
    Value: !Ref AllMostReadOnlyPolicy

  LambdaHandsonPolicyArn:
    Description: Lambda handson policy ARN
    Value: !Ref LambdaHandsonPolicy

  LambdaExecutionRoleArn:
    Description: Lambda execution role ARN (used when creating Lambda functions)
    Value: !GetAtt LambdaBasicExecutionRole.Arn
